services:
  postgres:
    image: postgres:16-alpine
    container_name: truckparts_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - truckparts_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible storage for product photos. RustFS replaces MinIO, whose
  # Docker Hub images are no longer published. The backend talks plain S3,
  # so its MINIO_* settings in .env keep working unchanged.
  minio:
    image: rustfs/rustfs:v1.0.0-rc.5
    container_name: truckparts_minio
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - truckparts_minio_data:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: truckparts_mailhog
    restart: unless-stopped
    ports:
      - "${MAIL_PORT:-1025}:1025"
      - "${MAILHOG_WEB_PORT:-8025}:8025"

  adminer:
    image: adminer:latest
    container_name: truckparts_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  truckparts_postgres_data:
  truckparts_minio_data:
